<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Bandit — New site coming early 2027</title>
<meta name="description" content="Studio Bandit is a creative design studio. Our new website lands early 2027 — say hello on Instagram @studio.bandit or at hello@studiobandit.co.uk.">
<meta name="theme-color" content="#064EED">
<meta property="og:title" content="Studio Bandit">
<meta property="og:description" content="New site coming early 2027. Say hello: hello@studiobandit.co.uk">
<meta property="og:image" content="https://www.studiobandit.co.uk/assets/sb-illustration.png">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
  @font-face{font-family:"Neue Montreal";font-weight:400;font-display:swap;
    src:url("fonts/NeueMontreal-Regular.woff2") format("woff2"),url("fonts/NeueMontreal-Regular.otf") format("opentype");}
  @font-face{font-family:"Neue Montreal";font-weight:500;font-display:swap;
    src:url("fonts/NeueMontreal-Medium.woff2") format("woff2"),url("fonts/NeueMontreal-Medium.otf") format("opentype");}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --sb-lime:#D7F48E; --sb-black:#141414; --sb-green:#354C2D;
    --sb-blue:#064EED; --sb-pink:#F49DE2; --sb-ice:#EBF5FF;
    --sb-title:"Neue Montreal","PP Neue Montreal","Helvetica Neue",Helvetica,Arial,sans-serif;
    --sb-mono:"Roboto Mono",ui-monospace,Menlo,monospace;
  }
  html,body{margin:0;background:var(--sb-blue);}
  .sb-hold{
    position:fixed;inset:0;z-index:9999;overflow:auto;
    background:var(--sb-blue);color:var(--sb-ice);
    font-family:var(--sb-title);-webkit-font-smoothing:antialiased;
    display:grid;grid-template-rows:auto 1fr auto;
    padding:clamp(20px,3.5vw,44px);box-sizing:border-box;min-height:100vh;min-height:100dvh;
  }
  .sb-hold *{box-sizing:border-box;}
  .sb-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
  .sb-logo{display:block;width:clamp(56px,6vw,84px);height:auto;}
  .sb-tag{font-family:var(--sb-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    display:flex;align-items:center;gap:8px;padding-top:6px;}
  .sb-dot{width:8px;height:8px;border-radius:50%;background:var(--sb-lime);animation:sb-pulse 1.6s ease-in-out infinite;}
  @keyframes sb-pulse{50%{opacity:.25}}
  .sb-main{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 0;}
  .sb-illus{width:min(520px,80vw,50vh);height:auto;display:block;animation:sb-bob 2.4s ease-in-out infinite;}
  @keyframes sb-bob{50%{transform:translateY(-6px)}}
  .sb-h1{font-weight:500;color:var(--sb-lime);font-size:clamp(34px,5.6vw,76px);line-height:.95;
    letter-spacing:-.035em;margin:clamp(4px,1vh,12px) 0 clamp(14px,2.4vh,24px);}
  .sb-copy{font-size:clamp(16px,1.5vw,20px);line-height:1.4;max-width:34em;margin:0;}
  .sb-links{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:clamp(18px,3vh,32px);}
  .sb-btn{font-family:var(--sb-mono);font-size:14px;text-decoration:none;color:var(--sb-black);
    background:var(--sb-lime);border-radius:999px;padding:12px 20px;transition:background .2s,transform .2s;}
  .sb-btn:hover{background:var(--sb-pink);transform:translateY(-2px);}
  .sb-btn:focus-visible{outline:2px solid var(--sb-ice);outline-offset:3px;}
  .sb-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
    font-family:var(--sb-mono);font-size:12px;letter-spacing:.04em;opacity:.8;}
  @media (prefers-reduced-motion:reduce){.sb-illus,.sb-dot{animation:none}}
</style>

</head>
<body>
<div class="sb-hold">
  <header class="sb-top">
    <img class="sb-logo" src="assets/sb-logo.png" alt="Studio Bandit">
    <span class="sb-tag"><span class="sb-dot" aria-hidden="true"></span>Under renovation</span>
  </header>

  <main class="sb-main">
    <img class="sb-illus" src="assets/sb-illustration.png" alt="Illustration of two Studio Bandit characters running">
    <h1 class="sb-h1">Hello!</h1>
    <p class="sb-copy">We are currently working on renovating our website, with aims to be operational early 2027. In the meantime, say hello via our Instagram or drop us an email.</p>
    <div class="sb-links">
      <a class="sb-btn" href="https://www.instagram.com/studio.bandit/" target="_blank" rel="noopener">@studio.bandit ↗</a>
      <a class="sb-btn" href="mailto:hello@studiobandit.co.uk">hello@studiobandit.co.uk ↗</a>
    </div>
  </main>

  <footer class="sb-foot">
    <span>© Studio Bandit Ltd</span>
    <span>New site — early 2027</span>
  </footer>
</div>

</body>
</html>
